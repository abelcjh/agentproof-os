[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-os"
version = "0.1.0"
description = "Verifiable multi-agent execution receipts for enterprise Agent Infra workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Abel Chin"}]
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["agentproof*"]
exclude = ["skills*", "fixtures*", "mcp_tools*", "docs*", "tests*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
